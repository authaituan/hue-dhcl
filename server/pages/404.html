<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Không tìm thấy trang</title>
    <!-- CSS nhúng thẳng: máy bị chặn IP cũng không tải được file CSS riêng. Mã băm tính lúc khởi động (server/security.js). -->
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
.err-page {
    background: #1E2A44;
    color: #FCF5EF;
    font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
}
.err-wrap { width: 100%; max-width: 620px; text-align: center; }
.err-art { width: 100%; height: auto; display: block; margin: 0 auto 36px; }
.err-title {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.3;
}
.err-title span { color: #FF7235; }
.err-text { margin-top: 12px; font-size: 1rem; color: #B8D8E0; line-height: 1.5; }
.err-link {
    display: inline-block;
    margin-top: 36px;
    color: #FCF5EF;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 4px;
}
.err-link:hover, .err-link:focus-visible { color: #FF7235; }
.err-link:focus-visible { outline: 2px solid #FF7235; outline-offset: 4px; border-radius: 2px; }
@media (max-width: 480px) {
    .err-title { font-size: 1.3rem; letter-spacing: 0.08em; }
    .err-art { margin-bottom: 28px; }
}
    </style>
</head>
<body class="err-page">
    <main class="err-wrap">
        <svg class="err-art" viewBox="0 0 560 240" role="img" aria-label="Minh họa núi và mặt trăng">
            <!-- chim -->
            <path d="M150 34 q8 -7 16 0 q8 -7 16 0" fill="none" stroke="#6DB5CA" stroke-width="2" stroke-linecap="round"/>
            <path d="M190 18 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#6DB5CA" stroke-width="1.6" stroke-linecap="round"/>
            <!-- mây xa -->
            <path d="M40 58 q10 -14 24 -4 q8 -10 20 -2" fill="none" stroke="#3B5578" stroke-width="2" stroke-linecap="round"/>
            <path d="M440 46 q10 -12 22 -3 q9 -9 20 0" fill="none" stroke="#3B5578" stroke-width="2" stroke-linecap="round"/>
            <!-- mặt trăng -->
            <circle cx="292" cy="100" r="74" fill="#FCF5EF"/>
            <!-- núi nét mảnh hai bên -->
            <path d="M20 168 L82 98 L130 152" fill="none" stroke="#4E7FA0" stroke-width="2" stroke-linejoin="round"/>
            <path d="M70 168 L120 112 L172 170" fill="none" stroke="#4E7FA0" stroke-width="2" stroke-linejoin="round"/>
            <path d="M104 140 l10 18" stroke="#4E7FA0" stroke-width="2" stroke-linecap="round"/>
            <path d="M392 170 L446 108 L500 170" fill="none" stroke="#4E7FA0" stroke-width="2" stroke-linejoin="round"/>
            <path d="M444 170 L492 122 L548 176" fill="none" stroke="#4E7FA0" stroke-width="2" stroke-linejoin="round"/>
            <path d="M470 140 l10 16" stroke="#4E7FA0" stroke-width="2" stroke-linecap="round"/>
            <!-- núi chính che trăng, sườn phải viền cam -->
            <path d="M200 200 L262 128 L282 150 L340 70 L432 200 Z" fill="#1E2A44"/>
            <path d="M262 128 L282 150 L340 70" fill="none" stroke="#FF7235" stroke-width="5" stroke-linejoin="round"/>
            <path d="M200 200 L262 128" fill="none" stroke="#4E7FA0" stroke-width="2"/>
            <path d="M340 70 L432 200" fill="none" stroke="#4E7FA0" stroke-width="2"/>
            <path d="M350 104 l14 22" stroke="#4E7FA0" stroke-width="2" stroke-linecap="round"/>
            <!-- mây phía trước -->
            <path d="M120 206 q6 -22 30 -18 q10 -22 36 -10 q14 -14 32 2 q20 -6 26 26 Z" fill="#2B3B5E" stroke="#3B5578" stroke-width="2" stroke-linejoin="round"/>
            <path d="M300 214 q8 -24 34 -18 q12 -26 44 -10 q20 -10 36 8 q18 0 22 20 Z" fill="#2B3B5E" stroke="#3B5578" stroke-width="2" stroke-linejoin="round"/>
            <path d="M440 204 q6 -18 26 -14 q10 -16 30 -4 q16 0 18 18 Z" fill="#2B3B5E" stroke="#3B5578" stroke-width="2" stroke-linejoin="round"/>
            <path d="M60 220 L520 220" stroke="#2B3B5E" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <h1 class="err-title"><span>404</span> Không tìm thấy trang</h1>
        <p class="err-text">Trang bạn tìm không tồn tại hoặc đã được chuyển đi.</p>
        <a class="err-link" href="/">Về trang chủ</a>
    </main>
</body>
</html>
